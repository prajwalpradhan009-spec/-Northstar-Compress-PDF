<svg xmlns="http://www.w3.org/2000/svg" viewBox="105 30 150 150" role="img" aria-labelledby="title desc">
  <title id="title">Northstar File Studio</title>
  <desc id="desc">PDF document icon above the Northstar File Studio name</desc>
